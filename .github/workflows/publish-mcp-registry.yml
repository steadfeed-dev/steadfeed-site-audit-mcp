name: Publish to MCP Registry

# Publishes both server entries with GitHub OIDC (no stored secrets):
#   io.github.steadfeed-dev/steadfeed-site-audit-mcp  -> ./server.json
#   io.github.steadfeed-dev/ai-visibility-mcp         -> ./deploy/ai-visibility/server.json
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish Site Audit MCP Server
        run: ./mcp-publisher publish ./server.json
      - name: Publish AI Visibility MCP Server
        run: ./mcp-publisher publish ./deploy/ai-visibility/server.json
